[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-irradiance-agent"
version = "0.1.0"
description = "Fetch solar irradiance forecasts from Open-Meteo API for battery charging optimization"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Solar Agent Contributors" }]
readme = "README.md"

dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
solar-agent = "solar_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=solar_agent --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.coverage.run]
branch = true
source = ["solar_agent"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
